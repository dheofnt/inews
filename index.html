<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chatbot Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe9e0;
    --surface:#ffffff;
    --surface-2:#d9fdd3;
    --border:#e4ded4;
    --text:#111b21;
    --text-dim:#667781;
    --accent-user:#128C7E;
    --accent-ai:#25D366;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--surface);
    color:var(--text);
    font-family:'Inter',sans-serif;
  }
  .app{
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:row;
    background:var(--surface);
  }

  /* ---- Sidebar ala WhatsApp Desktop (tampil di layar lebar saja) ---- */
  .sidebar{
    width:320px;flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
  }
  .sidebar-header{
    padding:16px;display:flex;align-items:center;gap:12px;
    border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .sidebar-avatar{
    width:40px;height:40px;border-radius:50%;flex-shrink:0;
    background:var(--accent-user);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  }
  .sidebar-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--text);}
  .sidebar-sub{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .sidebar-search{
    margin:10px 12px;padding:9px 14px;
    background:var(--bg);border-radius:20px;
    color:var(--text-dim);font-size:13px;flex-shrink:0;
  }
  .chat-list{flex:1;overflow-y:auto;}
  .chat-list-item{
    padding:12px 16px;display:flex;gap:12px;align-items:center;
    background:#f0f2f5;cursor:default;
  }
  .chat-list-avatar{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;
    background:var(--accent-ai);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;
  }
  .chat-list-info{flex:1;min-width:0;}
  .chat-list-name{font-size:14px;font-weight:600;color:var(--text);}
  .chat-list-preview{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}

  /* ---- Panel utama (header + chat + composer) ---- */
  .main-pane{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;}

  .header{
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface);
    flex-shrink:0;
  }
  .header-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:var(--text);}
  .header-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .header-actions{display:flex;align-items:center;gap:8px;}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-ai);animation:pulse 2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(37,211,102,0.4);}
    70%{box-shadow:0 0 0 6px rgba(37,211,102,0);}
    100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}
  }
  .btn-icon{
    background:transparent;border:none;color:var(--text-dim);
    width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background 0.15s,color 0.15s;
  }
  .btn-icon:hover{background:var(--bg);color:var(--text);}
  .btn-icon.active{background:rgba(37,211,102,0.15);color:#128C7E;}

  .chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);padding:16px 8%;gap:8px;}
  .empty-state{margin:auto;text-align:center;color:var(--text-dim);font-size:13px;max-width:340px;padding:20px;}
  .empty-state b{color:var(--text);font-family:'Space Grotesk',sans-serif;}

  .msg{display:block;width:auto;max-width:65%;padding:0;}
  .msg.user{align-self:flex-end;}
  .msg.ai,.msg.error,.msg.thinking{align-self:flex-start;}
  .msg.thinking{padding:4px 6px;color:var(--text-dim);font-size:13px;font-style:italic;}
  .msg-row{display:flex;gap:0;align-items:flex-start;}
  .avatar{display:none;}
  .msg-inner{flex:1;min-width:0;padding:8px 12px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,0.08);}
  .msg.user .msg-inner{background:var(--surface-2);border-bottom-right-radius:3px;}
  .msg.ai .msg-inner{background:var(--surface);border-bottom-left-radius:3px;}
  .msg.error .msg-inner{background:#ffe3e3;border-bottom-left-radius:3px;}
  .msg-label{display:none;}
  .msg-body{font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;color:var(--text);}
  .msg.error .msg-body{color:#c0392b;}

  .input-row{
    flex-shrink:0;
    display:flex;gap:8px;align-items:flex-end;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--bg);
  }
  textarea#userInput{
    flex:1;resize:none;min-height:24px;max-height:140px;
    background:var(--surface);border:none;outline:none;border-radius:22px;
    color:var(--text);font-family:'Inter',sans-serif;font-size:14.5px;padding:11px 16px;line-height:1.4;
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
  }
  .btn-mic{
    width:40px;height:40px;flex-shrink:0;border-radius:50%;border:none;
    background:var(--surface);color:var(--accent-user);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
    transition:background 0.15s,color 0.15s;
  }
  .btn-mic:hover{color:#075E54;}
  .btn-mic.listening{background:rgba(37,211,102,0.18);color:#075E54;animation:micpulse 1.1s infinite;}
  .btn-mic:disabled{opacity:0.35;cursor:not-allowed;}
  @keyframes micpulse{
    0%{box-shadow:0 0 0 0 rgba(37,211,102,0.35);}
    70%{box-shadow:0 0 0 8px rgba(37,211,102,0);}
    100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}
  }
  .msg-speak{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;border:1px solid var(--border);
    background:transparent;color:var(--text-dim);font-size:11px;cursor:pointer;margin-top:8px;
  }
  .msg-speak:hover{color:var(--accent-ai);border-color:var(--accent-ai);}
  .btn-send{
    background:var(--accent-ai);color:#fff;width:40px;height:40px;padding:0;flex-shrink:0;
    border:none;border-radius:50%;font-size:16px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .btn-send:hover{opacity:0.85;}
  .btn-send:disabled{opacity:0.35;cursor:not-allowed;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .chart-wrap{
    margin-top:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 14px 10px;
  }
  .chart-wrap-title{
    font-family:'Inter',sans-serif;font-weight:600;
    font-size:12.5px;
    color:var(--text);
    margin-bottom:10px;
  }
  .chart-wrap canvas{max-width:100%;}

  .file-card{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .file-card.ready{color:var(--text);}
  .file-card.error{color:#c0392b;border-color:rgba(224,72,77,0.3);}
  .file-icon{font-size:22px;flex-shrink:0;}
  .file-info{flex:1;min-width:0;}
  .file-name{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-type{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .file-download{
    background:var(--accent-ai);color:#fff;font-family:'Inter',sans-serif;
    font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:20px;
    text-decoration:none;flex-shrink:0;
  }
  .file-download:hover{opacity:0.85;}

  /* ---- Mobile (≤700px): sidebar disembunyikan, header jadi gradasi teal
     ala aplikasi WhatsApp mobile (bukan WhatsApp Desktop) ---- */
  @media (max-width: 700px){
    .sidebar{display:none;}
    .header{
      background:linear-gradient(135deg,#128C7E,#075E54);
      color:#fff;
      padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
      border-bottom:none;
    }
    .header-title{color:#fff;font-size:15px;}
    .header-sub{color:rgba(255,255,255,0.82);}
    .status{color:rgba(255,255,255,0.85);}
    .btn-icon{color:rgba(255,255,255,0.85);}
    .btn-icon:hover{background:rgba(255,255,255,0.15);color:#fff;}
    .btn-icon.active{background:rgba(255,255,255,0.2);color:#fff;}

    .chat{padding:12px 10px;}
    .msg{max-width:82%;}
    textarea#userInput{font-size:16px;} /* cegah auto-zoom iOS Safari */
  }
</style>
</head>
<body>

<div class="app">

  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-avatar">CD</div>
      <div>
        <div class="sidebar-title">Chatbot Data</div>
        <div class="sidebar-sub">Vercel + Gemini</div>
      </div>
    </div>
    <div class="sidebar-search">🔍 Cari...</div>
    <div class="chat-list">
      <div class="chat-list-item">
        <div class="chat-list-avatar">A</div>
        <div class="chat-list-info">
          <div class="chat-list-name">Asisten Data</div>
          <div class="chat-list-preview">Dibekali data & instruksi khusus dari kamu</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main-pane">
    <div class="header">
      <div>
        <div class="header-title">Chatbot Data</div>
        <div class="header-sub">Ditenagai Google Gemini, dibekali data & instruksi khusus</div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="speakToggleBtn" type="button">🔇</button>
        <div class="status"><span class="status-dot"></span>terhubung</div>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="empty-state" id="emptyState">
        <b>Mulai ngobrol</b><br>
        Tanya apa aja — chatbot ini sudah dibekali data & instruksi dari pemiliknya.
      </div>
    </div>

    <div class="input-row">
      <button class="btn-mic" id="micBtn" type="button" title="Rekam suara">🎤</button>
      <textarea id="userInput" placeholder="Tulis pesan... (Enter untuk kirim, Shift+Enter baris baru)" rows="1"></textarea>
      <button class="btn-send" id="sendBtn" title="Kirim" aria-label="Kirim">➤</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8/build/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4/dist/exceljs.min.js"></script>
<script>
  const chatEl = document.getElementById('chat');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const speakToggleBtn = document.getElementById('speakToggleBtn');

  let history = []; // {role, content}
  let busy = false;

  // ---- Fitur suara: input suara (STT) + baca balasan (TTS) ----
  // Keduanya pakai Web Speech API bawaan browser — gratis, tanpa API key
  // tambahan. Dukungan browser bervariasi: STT paling stabil di Chrome/Edge
  // (desktop & Android) dan Safari iOS 14.5+; kurang/tidak didukung Firefox.
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let autoSpeak = localStorage.getItem('autoSpeak') === '1';

  function updateSpeakToggleUI() {
    speakToggleBtn.textContent = autoSpeak ? '🔊' : '🔇';
    speakToggleBtn.classList.toggle('active', autoSpeak);
    speakToggleBtn.title = autoSpeak ? 'Baca balasan otomatis: aktif (klik untuk matikan)' : 'Baca balasan otomatis: nonaktif (klik untuk aktifkan)';
  }
  updateSpeakToggleUI();

  speakToggleBtn.addEventListener('click', () => {
    autoSpeak = !autoSpeak;
    localStorage.setItem('autoSpeak', autoSpeak ? '1' : '0');
    updateSpeakToggleUI();
    if (!autoSpeak && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  });

  function speak(text) {
    if (!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'id-ID';
    window.speechSynthesis.speak(utter);
  }

  if (SpeechRecognitionCtor) {
    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'id-ID';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.addEventListener('result', (e) => {
      const transcript = e.results[0][0].transcript;
      userInput.value = transcript;
      send();
    });
    recognition.addEventListener('end', () => {
      listening = false;
      micBtn.classList.remove('listening');
    });
    recognition.addEventListener('error', () => {
      listening = false;
      micBtn.classList.remove('listening');
    });

    micBtn.addEventListener('click', () => {
      if (busy) return;
      if (listening) {
        recognition.stop();
        return;
      }
      listening = true;
      micBtn.classList.add('listening');
      try {
        recognition.start();
      } catch (e) {
        listening = false;
        micBtn.classList.remove('listening');
      }
    });
  } else {
    micBtn.disabled = true;
    micBtn.title = 'Browser ini tidak mendukung input suara';
  }

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener('click', send);

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Kerangka pesan bersama: baris (avatar + kolom isi) dipakai baik oleh
  // pesan biasa (appendMessage) maupun balasan asisten yang bisa berisi
  // chart/file (appendAssistantMessage) — supaya keduanya konsisten dengan
  // tampilan baru (avatar di desktop, bubble di mobile).
  function createMessageShell(role, labelText) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const row = document.createElement('div');
    row.className = 'msg-row';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = (labelText || '?').charAt(0).toUpperCase();
    const inner = document.createElement('div');
    inner.className = 'msg-inner';
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = labelText;
    inner.appendChild(label);
    row.appendChild(avatar);
    row.appendChild(inner);
    div.appendChild(row);
    return { div, inner };
  }

  function appendMessage(role, content) {
    const el = document.getElementById('emptyState');
    if (el) el.remove();

    const labelText = role === 'user' ? 'Kamu' : (role === 'error' ? 'Error' : 'Asisten');
    const { div, inner } = createMessageShell(role, labelText);
    const body = document.createElement('div');
    body.className = 'msg-body';
    body.innerHTML = escapeHtml(content);
    inner.appendChild(body);

    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  // --- Dukungan chart & file ---
  // Balasan Claude bisa mengandung blok ```chart ... ``` dan/atau
  // ```file ... ``` — kita pisahkan dari teks biasa, lalu render masing-masing.
  function parseSpecialBlocks(rawText) {
    let text = rawText;
    let chart = null;
    let file = null;

    const chartMatch = text.match(/```chart\s*([\s\S]*?)```/);
    if (chartMatch) {
      try { chart = JSON.parse(chartMatch[1].trim()); } catch (e) { chart = null; }
      text = text.slice(0, chartMatch.index) + text.slice(chartMatch.index + chartMatch[0].length);
    }

    const fileMatch = text.match(/```file\s*([\s\S]*?)```/);
    if (fileMatch) {
      try { file = JSON.parse(fileMatch[1].trim()); } catch (e) { file = null; }
      text = text.slice(0, fileMatch.index) + text.slice(fileMatch.index + fileMatch[0].length);
    }

    text = text.replace(/\n{3,}/g, '\n\n').trim();
    return { text, chart, file };
  }

  let chartCounter = 0;

  function cssVar(name, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }

  function renderChart(canvas, config) {
    // Warna diambil dari variabel tema yang sedang aktif (otomatis beda di
    // desktop vs mobile) supaya grafik selalu senada, bukan warna tetap.
    const palette = ['#10a37f', '#f0883e', '#6366f1', '#ec4899', '#0ea5e9', '#f59e0b'];
    const textColor = cssVar('--text', '#333333');
    const dimColor = cssVar('--text-dim', '#888888');
    const gridColor = cssVar('--border', '#eeeeee');
    const bgColor = cssVar('--bg', '#ffffff');

    const type = ['bar', 'line', 'pie'].includes(config.type) ? config.type : 'bar';
    const labels = config.labels || [];
    const series = config.series || [];

    let chartData;
    if (type === 'pie') {
      const s = series[0];
      chartData = {
        labels,
        datasets: [{
          data: s ? s.values : [],
          backgroundColor: labels.map((_, i) => palette[i % palette.length]),
          borderColor: bgColor,
          borderWidth: 2
        }]
      };
    } else {
      chartData = {
        labels,
        datasets: series.map((s, i) => ({
          label: s.name || ('Seri ' + (i + 1)),
          data: s.values || [],
          backgroundColor: type === 'bar' ? palette[i % palette.length] : 'transparent',
          borderColor: palette[i % palette.length],
          borderWidth: 2.5,
          borderRadius: type === 'bar' ? 6 : 0,
          borderSkipped: false,
          maxBarThickness: 46,
          tension: 0.35,
          pointRadius: type === 'line' ? 3 : 0,
          pointBackgroundColor: palette[i % palette.length]
        }))
      };
    }

    new Chart(canvas, {
      type,
      data: chartData,
      options: {
        responsive: true,
        animation: { duration: 500 },
        plugins: {
          legend: {
            display: series.length > 1 || type === 'pie',
            labels: { color: textColor, font: { family: 'Inter', size: 11 }, usePointStyle: true, boxWidth: 8 }
          }
        },
        scales: type === 'pie' ? {} : {
          x: { ticks: { color: dimColor, font: { family: 'Inter', size: 11 } }, grid: { display: false } },
          y: { ticks: { color: dimColor, font: { family: 'Inter', size: 11 } }, grid: { color: gridColor } }
        }
      }
    });
  }

  // ---- Generator file (jalan di browser, tidak perlu backend) ----

  async function generateDocxBlob(config) {
    const { Document, Packer, Paragraph, HeadingLevel } = window.docx;
    const children = [];
    if (config.title) {
      children.push(new Paragraph({ text: config.title, heading: HeadingLevel.TITLE }));
    }
    (config.sections || []).forEach(section => {
      if (section.heading) {
        const level = section.level === 2 ? HeadingLevel.HEADING_2 : HeadingLevel.HEADING_1;
        children.push(new Paragraph({ text: section.heading, heading: level }));
      }
      (section.paragraphs || []).forEach(p => children.push(new Paragraph({ text: p })));
    });
    const doc = new Document({ sections: [{ children }] });
    return await Packer.toBlob(doc);
  }

  async function generatePptxBlob(config) {
    const pptx = new PptxGenJS();
    (config.slides || []).forEach(slide => {
      const s = pptx.addSlide();
      if (slide.title) {
        s.addText(slide.title, { x: 0.5, y: 0.4, w: 9, fontSize: 24, bold: true, color: '1F2A2E' });
      }
      if (slide.bullets && slide.bullets.length) {
        s.addText(
          slide.bullets.map(b => ({ text: b, options: { bullet: true, breakLine: true } })),
          { x: 0.6, y: 1.3, w: 8.8, fontSize: 16, color: '333333' }
        );
      }
    });
    return await pptx.write('blob');
  }

  async function generateXlsxBlob(config) {
    const workbook = new ExcelJS.Workbook();
    (config.sheets || []).forEach(sheet => {
      const ws = workbook.addWorksheet(sheet.name || 'Sheet1');
      if (sheet.headers) {
        ws.addRow(sheet.headers);
        ws.getRow(1).font = { bold: true };
      }
      (sheet.rows || []).forEach(row => ws.addRow(row));
      ws.columns.forEach(col => { col.width = 18; });
    });
    const buffer = await workbook.xlsx.writeBuffer();
    return new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  async function buildFile(fileConfig) {
    const filename = fileConfig.filename || ('dokumen.' + fileConfig.type);
    let blob;
    if (fileConfig.type === 'docx') blob = await generateDocxBlob(fileConfig);
    else if (fileConfig.type === 'pptx') blob = await generatePptxBlob(fileConfig);
    else if (fileConfig.type === 'xlsx') blob = await generateXlsxBlob(fileConfig);
    else throw new Error('Tipe file tidak dikenal: ' + fileConfig.type);
    return { blob, filename };
  }

  function fileIconFor(type) {
    if (type === 'docx') return '📄';
    if (type === 'pptx') return '📊';
    if (type === 'xlsx') return '📈';
    return '📁';
  }

  async function renderFileCard(container, fileConfig) {
    const card = document.createElement('div');
    card.className = 'file-card';
    card.textContent = 'Menyiapkan file...';
    container.appendChild(card);
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      const { blob, filename } = await buildFile(fileConfig);
      const url = URL.createObjectURL(blob);

      card.className = 'file-card ready';
      card.innerHTML = '';

      const icon = document.createElement('span');
      icon.className = 'file-icon';
      icon.textContent = fileIconFor(fileConfig.type);

      const info = document.createElement('div');
      info.className = 'file-info';
      const nameEl = document.createElement('div');
      nameEl.className = 'file-name';
      nameEl.textContent = filename;
      const typeEl = document.createElement('div');
      typeEl.className = 'file-type';
      typeEl.textContent = fileConfig.type.toUpperCase();
      info.appendChild(nameEl);
      info.appendChild(typeEl);

      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.className = 'file-download';
      link.textContent = 'Unduh';

      card.appendChild(icon);
      card.appendChild(info);
      card.appendChild(link);
    } catch (err) {
      card.className = 'file-card error';
      card.textContent = 'Gagal membuat file: ' + err.message;
    }
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function appendAssistantMessage(rawText) {
    const el = document.getElementById('emptyState');
    if (el) el.remove();

    const { text, chart, file } = parseSpecialBlocks(rawText);

    const { div, inner } = createMessageShell('ai', 'Asisten');

    if (text) {
      const body = document.createElement('div');
      body.className = 'msg-body';
      body.innerHTML = escapeHtml(text);
      inner.appendChild(body);

      if ('speechSynthesis' in window) {
        const speakBtn = document.createElement('button');
        speakBtn.type = 'button';
        speakBtn.className = 'msg-speak';
        speakBtn.textContent = '🔊';
        speakBtn.title = 'Dengarkan balasan ini';
        speakBtn.addEventListener('click', () => speak(text));
        inner.appendChild(speakBtn);
      }
    }

    chatEl.appendChild(div);

    if (chart) {
      chartCounter += 1;
      const wrap = document.createElement('div');
      wrap.className = 'chart-wrap';
      if (chart.title) {
        const title = document.createElement('div');
        title.className = 'chart-wrap-title';
        title.textContent = chart.title;
        wrap.appendChild(title);
      }
      const canvas = document.createElement('canvas');
      canvas.id = 'chart-' + chartCounter;
      canvas.height = 200;
      wrap.appendChild(canvas);
      inner.appendChild(wrap);
      renderChart(canvas, chart);
    }

    if (file) {
      renderFileCard(inner, file); // async, tidak perlu ditunggu
    }

    if (text && autoSpeak) speak(text);

    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function send() {
    const text = userInput.value.trim();
    if (!text || busy) return;

    appendMessage('user', text);
    history.push({ role: 'user', content: text });
    userInput.value = '';
    userInput.style.height = 'auto';

    busy = true;
    sendBtn.disabled = true;
    if (SpeechRecognitionCtor) micBtn.disabled = true;
    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'msg thinking';
    thinkingEl.textContent = 'Asisten sedang mengetik...';
    chatEl.appendChild(thinkingEl);
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      // Backend sudah otomatis membawa instructions.md + isi folder knowledge/
      // sebagai konteks — frontend cukup kirim riwayat percakapan.
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || ('Request gagal (' + response.status + ')'));
      }

      const reply = (data.content || [])
        .map(block => block.text || '')
        .filter(Boolean)
        .join('\n');

      thinkingEl.remove();
      if (reply) {
        appendAssistantMessage(reply);
      } else {
        appendMessage('ai', '(tidak ada respons)');
      }
      history.push({ role: 'assistant', content: reply });

    } catch (err) {
      thinkingEl.remove();
      appendMessage('error', 'Gagal menghubungi asisten: ' + err.message);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      if (SpeechRecognitionCtor) micBtn.disabled = false;
      userInput.focus();
    }
  }
</script>
